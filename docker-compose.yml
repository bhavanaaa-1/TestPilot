services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: testpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-testpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpilot_secret}
      POSTGRES_DB: ${POSTGRES_DB:-testpilot}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-testpilot} -d ${POSTGRES_DB:-testpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: testpilot_postgres_data
